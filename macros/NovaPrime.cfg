#######################################################################################################
#                                           Nova Prime                                                #
#   Prime line before printing: fixed Y, centered on the bed, optional X offset.                      #
#                                                                                                     #
#   Settings live in printer.cfg under [gcode_macro _NOVA_PRIME_VARS] (install.sh adds that table).   #
#   Anything missing from the table uses these defaults:                                              #
#######################################################################################################
#
# variable_verbose: True          # Print purge position to the console
# variable_purge_height: 0.8      # Nozzle Z during purge
# variable_tip_distance: 2        # Filament tip-to-nozzle distance before purging
# variable_purge_amount: 30       # mm of filament purged (also the line length in mm)
# variable_flow_rate: 20          # Purge flow in mm³/s
# variable_purge_y: 5             # Y position of the purge line
# variable_purge_x_offset: 0      # mm from bed center. Negative = left, positive = right
#
#######################################################################################################

[gcode_macro NOVA_PRIME]
description: Nova Prime: purge line at a fixed Y, centered on the bed with an optional X offset
gcode:
    {% set v = printer["gcode_macro _NOVA_PRIME_VARS"]|default({}) %}
    {% set verbose        = v.verbose|default(True) %}
    {% set purge_height   = v.purge_height|default(0.8)|float %}
    {% set tip_distance   = v.tip_distance|default(2)|float %}
    {% set purge_amount   = v.purge_amount|default(30)|float %}
    {% set flow_rate      = v.flow_rate|default(20)|float %}
    {% set purge_y        = v.purge_y|default(5)|float %}
    {% set purge_x_offset = v.purge_x_offset|default(0)|float %}

    {% set travel_speed  = printer.toolhead.max_velocity * 60 %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section|float %}
    {% set x_max         = printer.toolhead.axis_maximum.x|float %}
    {% set x_center      = x_max / 2.0 %}

    {% set purge_move_speed = (flow_rate / 5.0) * 60 %}
    {% set retract = 'G10' if printer.firmware_retraction is defined else 'G1 E-0.5 F2100' %}

    # Start X = bed center, shifted by the offset, clamped so the line and string-break stay on the bed
    {% set start_x = x_center - (purge_amount / 2) + purge_x_offset %}
    {% set start_x = [[start_x, 0]|max, x_max - purge_amount - 10]|min %}

    {% if cross_section < 5 %}
        {action_respond_info("max_extrude_cross_section must be 5 or greater for purge. Purge skipped.")}
    {% else %}
        {% if verbose %}
            {action_respond_info("Nova Prime: %.0fmm at X%.1f Y%.1f" % (purge_amount, start_x, purge_y))}
        {% endif %}

        SAVE_GCODE_STATE NAME=Nova_Prime_State
        G92 E0
        G90
        G0 X{start_x} Y{purge_y} F{travel_speed}
        G0 Z{purge_height}
        M83
        G1 E{tip_distance} F{purge_move_speed}
        G1 X{start_x + purge_amount} E{purge_amount} F{purge_move_speed}
        {retract}
        G0 X{start_x + purge_amount + 10} F{travel_speed}
        G92 E0
        M82
        G0 Z{purge_height * 2} F{travel_speed}
        RESTORE_GCODE_STATE NAME=Nova_Prime_State
    {% endif %}

#######################################################################################################
#   Old name, so START_PRINT macros that still call my_purge keep working.                            #
#   Remove once every printer's START_PRINT calls NOVA_PRIME.                                         #
#######################################################################################################

[gcode_macro my_purge]
gcode:
    NOVA_PRIME {rawparams}
