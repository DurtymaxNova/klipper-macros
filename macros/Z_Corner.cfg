[gcode_macro Z_CORNER]
description: Move a single Z stepper. Z_CORNER M=0|1|2 D=mm
gcode:
    {% set m = params.M|default(0)|int %}
    {% set d = params.D|default(1)|float %}
    {% set name = "stepper_z" if m == 0 else "stepper_z" ~ m %}
    FORCE_MOVE STEPPER={name} DISTANCE={d} VELOCITY=5 ACCEL=50
    RESPOND MSG="Moved {name} by {d}mm - re-home and Z_TILT_ADJUST before printing"